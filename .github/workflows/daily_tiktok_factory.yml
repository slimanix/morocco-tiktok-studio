name: 🇲🇦 Moroccan TikTok Autonomous Factory (@wa.3ibad.lah4)

on:
  schedule:
    # Runs every day at 19:30 UTC (20:30 Moroccan Time)
    - cron: '30 19 * * *'
  # Allows triggering manually anytime with a single click from GitHub or Phone App!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: 🚀 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: 🤖 Execute Daily Autonomous Cycle
        run: |
          python system_autopilot_daemon.py

      - name: 💾 Save Generated Videos as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-videos-${{ github.run_id }}
          path: output/batch_*/
          retention-days: 7

      - name: 🔄 Commit Updated Account State & Dashboard Data
        run: |
          git config --global user.name 'TikTok Autopilot Bot'
          git config --global user.email 'bot@wa3ibadlah.ma'
          git add output/account_state.json output/daily_topics.json output/daily_scripts.json output/autonomous_service.log
          git commit -m "🤖 Auto-Update: Completed Daily Production Cycle [skip ci]" || echo "No changes to commit"
          git push
